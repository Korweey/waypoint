<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Waypoint{% endblock %}</title>

    <style>

	{% load static %}
	<link rel="stylesheet" href="{% static 'style.css' %}">

        /* Simple clean styling — no external dependencies */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Georgia, serif;
            background: #f5f5f0;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: #2d5a27;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.8rem; letter-spacing: 1px; }

        nav a {
            color: #c8e6c9;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 1rem;
        }
        nav a:hover { color: white; text-decoration: underline; }

        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        h2 { color: #2d5a27; margin-bottom: 1rem; }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: #888;
            font-size: 0.85rem;
            border-top: 1px solid #ddd;
            margin-top: 3rem;
        }
    </style>

</head>
<body>

<header>
    <h1>🥾 Waypoint</h1>
    <nav>
        <a href="{% url 'trails:index' %}">Trails</a>
        <a href="{% url 'trails:about' %}">About</a>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>Waypoint Trail Finder &mdash; CCGC 5003 &mdash; Qawiyy Rabiu (N10038749)</p>
</footer>

</body>
</html>
